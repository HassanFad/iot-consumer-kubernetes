apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: iotconsumer-dp
spec:
  replicas: 2
  template:
    metadata:
      labels:
        app: iotconsumer
    spec:
      containers:
      - name: iotconsumer
        image: <your value>/iotreceiver
        ports:
        - name: iotconsumerport
          containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 512Mi 
        env:
          - name: DATABASE
            valueFrom:
              secretKeyRef:
                name: iotconsumer-sc
                key: database
          - name: DBTABLE
            valueFrom:
              secretKeyRef:
                name: iotconsumer-sc
                key: dbtable
          - name: DBPORT
            valueFrom:
              secretKeyRef:
                name: iotconsumer-sc
                key: dbport
          - name: DBUID
            valueFrom:
              secretKeyRef:
                name: iotconsumer-sc
                key: dbuid
          - name: DBPWD
            valueFrom:
              secretKeyRef:
                name: iotconsumer-sc
                key: dbpwd
          - name: DBHOSTNAME
            valueFrom:
              secretKeyRef:
                name: iotconsumer-sc
                key: dbhostname
          - name: IOTORG
            valueFrom:
              secretKeyRef:
                name: iotconsumer-sc
                key: iotorg
          - name: IOTAUTHKEY
            valueFrom:
              secretKeyRef:
                name: iotconsumer-sc
                key: iotauthkey
          - name: IOTAUTHTOKEN
            valueFrom:
              secretKeyRef:
                name: iotconsumer-sc
                key: iotauthtoken
